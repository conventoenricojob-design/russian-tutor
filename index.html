<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Russian exercise</title>
<style>
:root { --bg:#FAF9F5; --panel:#FFFFFF; --ink:#1F1E1D; --muted:#74716A; --line:#E7E3D9; --accent:#C96442; --soft:#F6E8E1; --ok:#3E7D55; --oksoft:#E4F0E6; --bad:#B54A3A; --badsoft:#F7E3DF; --key:#F3F1EA;
  --ru:"Charter","Georgia","Times New Roman",serif; --serif: ui-serif,"New York",Charter,Cambria,Georgia,serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#262624; --panel:#30302E; --ink:#F0EEE6; --muted:#A6A39A; --line:#3E3D39; --accent:#D97757; --soft:#3D2C24; --ok:#7CC495; --oksoft:#22332A; --bad:#E8826E; --badsoft:#3D2A25; --key:#3A3A37; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif; padding-bottom: 300px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
h1 { font: 500 28px/1.2 var(--serif); margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.status { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--key); color: var(--muted); }
.status i { width: 9px; height: 9px; border-radius: 50%; background: #c9a227; }
.status.on i { background: var(--ok); } .status.off i { background: var(--bad); }
.instr { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 16px 0; font-weight: 600; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; }
.item.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.item.ok { border-color: var(--ok); } .item.bad { border-color: var(--bad); }
.q { font: 20px/1.4 var(--ru); margin-bottom: 8px; }
.q b { color: var(--muted); font: 600 14px -apple-system,"Segoe UI",sans-serif; margin-right: 6px; }
.a { width: 100%; resize: vertical; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font: 22px var(--ru); color: var(--ink); outline: none; }
.a:focus { border-color: var(--accent); }
.fb { margin-top: 8px; font-size: 14px; display: none; padding: 7px 10px; border-radius: 9px; }
.fb.show { display: block; } .fb.ok { background: var(--oksoft); color: var(--ok); } .fb.bad { background: var(--badsoft); color: var(--bad); } .fb.note { background: var(--key); color: var(--ink); }
.fb .ru { font-family: var(--ru); font-size: 18px; }
.text { font: 20px/1.7 var(--ru); white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 12px; }
.kb { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 8px 12px; box-shadow: 0 -6px 24px rgba(0,0,0,.08); }
.kb.hide .rows { display: none; }
.kb .bar { display: flex; justify-content: space-between; align-items: center; max-width: 980px; margin: 0 auto 6px; font-size: 13px; color: var(--muted); }
.kb .rows { max-width: 980px; margin: 0 auto; }
.kb .r { display: flex; gap: 5px; justify-content: center; margin: 5px 0; }
.kb button { flex: 1; max-width: 62px; height: 46px; border: 1px solid var(--line); background: var(--key); color: var(--ink); border-radius: 9px; font: 20px var(--ru); cursor: pointer; padding: 0; }
.kb button:active, .kb button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.kb button.w2 { max-width: 110px; flex: 1.8; font: 14px -apple-system,"Segoe UI",sans-serif; }
.kb button.sp { max-width: 420px; flex: 6; font: 14px -apple-system,"Segoe UI",sans-serif; }
.tbtn { border: 1px solid var(--line); background: var(--key); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.msg { background: var(--soft); border-radius: 12px; padding: 10px 14px; margin: 10px 0; display: none; }
.msg.show { display: block; }
.err { max-width: 560px; margin: 80px auto; text-align: center; color: var(--muted); }
@media (max-width: 600px) { .kb button { height: 40px; font-size: 17px; } .kb .r { gap: 3px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Loading…</div></div>
<div class="kb" id="kb">
  <div class="bar"><span>Russian keyboard · click a box, then type here or on your keyboard</span><button class="tbtn" onclick="document.getElementById('kb').classList.toggle('hide')">Hide / show</button></div>
  <div class="rows" id="rows"></div>
</div>
<script>
'use strict';
/* Pagina dello studente: riceve l'esercizio dal link (#…), si collega in tempo reale all'app dell'insegnante
   (WebRTC, segnalazione via ntfy.sh) e mostra una tastiera russa completa. */
const NTFY = 'https://ntfy.sh/';
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const b64d = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function unpack(str) {
  const bytes = b64d(str.slice(1));
  if (str[0] === 'z') return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function pack(obj) {
  const s = JSON.stringify(obj);
  if (window.CompressionStream) return 'z' + b64e(await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  return 'j' + b64e(new TextEncoder().encode(s));
}

let EX = null, SID = Math.random().toString(36).slice(2, 12), pc = null, dc = null, cur = 0, sendT = null, slowT = null, lastSent = '';
const values = [];

/* ---- tastiera */
const ROWS = ['ё1234567890-', 'йцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю.,'];
let shift = false;
function drawKb() {
  const k = c => `<button data-k="${c}">${shift ? c.toUpperCase() : c}</button>`;
  $('#rows').innerHTML = ROWS.map((r, i) => `<div class="r">${i === 3 ? `<button class="w2 ${shift ? 'on' : ''}" data-k="SHIFT">⇧ Shift</button>` : ''}${[...r].map(k).join('')}${i === 0 ? '<button class="w2" data-k="BS">⌫</button>' : ''}${i === 3 ? '<button class="w2" data-k="?">?</button>' : ''}</div>`).join('')
    + `<div class="r"><button class="w2" data-k="!">!</button><button class="w2" data-k="—">—</button><button class="sp" data-k=" ">space</button><button class="w2" data-k="´" title="stress mark">´</button><button class="w2" data-k="ENTER">Next ⏎</button></div>`;
}
document.addEventListener('mousedown', e => { if (e.target.closest('#kb button[data-k]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest('#kb button[data-k]'); if (!b) return;
  const k = b.dataset.k, inp = document.querySelector(`.a[data-i="${cur}"]`) || document.querySelector('.a'); if (!inp) return;
  if (k === 'SHIFT') { shift = !shift; return drawKb(); }
  if (k === 'ENTER' && inp.tagName === 'INPUT') { focusItem(Math.min(cur + 1, EX.q.length - 1)); return; }
  const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
  if (k === 'BS') { const a = s === en ? Math.max(0, s - 1) : s; inp.value = inp.value.slice(0, a) + inp.value.slice(en); inp.selectionStart = inp.selectionEnd = a; }
  else { const c = k === 'ENTER' ? '\n' : k === '´' ? '́' : (shift ? k.toUpperCase() : k); inp.value = inp.value.slice(0, s) + c + inp.value.slice(en); inp.selectionStart = inp.selectionEnd = s + c.length; if (shift) { shift = false; drawKb(); } }
  inp.focus(); inp.dispatchEvent(new Event('input', { bubbles: true }));
});

/* ---- esercizio */
function render() {
  $('#app').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>${esc(EX.t)}</h1><span class="status" id="st"><i></i><span>Connecting to your teacher…</span></span></div>
    <p class="sub">${EX.n ? 'From ' + esc(EX.n) + ' · ' : ''}Your teacher sees what you type, live.</p>
    <div class="msg" id="msg"></div>
    ${EX.i ? `<div class="instr">${esc(EX.i)}</div>` : ''}
    ${EX.x ? `<div class="text">${esc(EX.x)}</div>` : ''}
    ${EX.q.map((q, i) => `<div class="item" id="it${i}">${q === '✍️' ? '' : `<div class="q"><b>${i + 1}.</b>${esc(q)}</div>`}
      ${q === '✍️' ? `<textarea class="a" data-i="${i}" rows="8" spellcheck="false" placeholder="…"></textarea>` : `<input class="a" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">`}
      <div class="fb" id="fb${i}"></div></div>`).join('')}`;
  document.querySelectorAll('.a').forEach(inp => {
    inp.addEventListener('focus', () => focusItem(+inp.dataset.i, true));
    inp.addEventListener('input', () => { values[+inp.dataset.i] = inp.value; queueSend(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.tagName === 'INPUT') { e.preventDefault(); focusItem(Math.min(+inp.dataset.i + 1, EX.q.length - 1)); } });
  });
  focusItem(0);
}
function focusItem(i, fromFocus) {
  cur = i; document.querySelectorAll('.item').forEach((el, j) => el.classList.toggle('cur', j === i));
  if (!fromFocus) document.querySelector(`.a[data-i="${i}"]`)?.focus();
  queueSend();
}
function setStatus(kind, text) { const el = $('#st'); if (!el) return; el.className = 'status ' + kind; el.querySelector('span').textContent = text; }

/* ---- invio delle risposte */
function state() { return { k: 'state', v: EX.q.map((_, i) => values[i] || ''), c: cur }; }
function queueSend() {
  clearTimeout(sendT);
  sendT = setTimeout(() => {
    if (dc && dc.readyState === 'open') dc.send(JSON.stringify(state()));
    else slowSend();
  }, 80);
}
function slowSend() { // senza collegamento diretto: via ntfy, al massimo ogni 6 secondi
  if (slowT) return;
  slowT = setTimeout(async () => { slowT = null; const s = JSON.stringify(state()); if (s !== lastSent) { lastSent = s; await publish({ f: 's', k: 'msg', sid: SID, d: s }); } }, 6000);
}
function onTeacher(m) {
  if (m.k === 'mark') {
    const fb = $('#fb' + m.i), it = $('#it' + m.i); if (!fb) return;
    it.classList.remove('ok', 'bad'); if (m.ok === true) it.classList.add('ok'); if (m.ok === false) it.classList.add('bad');
    fb.className = 'fb show ' + (m.ok === true ? 'ok' : m.ok === false ? 'bad' : 'note');
    fb.innerHTML = (m.ok === true ? '✓ Correct' : m.ok === false ? '✗ Not quite' : '') + (m.a ? ` · answer: <span class="ru">${esc(m.a)}</span>` : '') + (m.note ? ` · ${esc(m.note)}` : '');
  } else if (m.k === 'note') { const el = $('#msg'); el.textContent = '💬 ' + m.text; el.classList.add('show'); }
  else if (m.k === 'focus') focusItem(m.i);
}

/* ---- collegamento: ntfy per presentarsi, poi WebRTC */
async function publish(obj) { try { await fetch(NTFY + EX.r, { method: 'POST', body: JSON.stringify(obj) }); } catch { } }
function waitIce(p) { return new Promise(res => { if (p.iceGatheringState === 'complete') return res(); const t = setTimeout(res, 3000); p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } }); }); }
async function onSignal(msg) {
  if (msg.f !== 't' || (msg.sid && msg.sid !== SID)) return;
  if (msg.k === 'offer') {
    try { pc?.close(); } catch { }
    pc = new RTCPeerConnection({ iceServers: ICE });
    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => { setStatus('on', 'Connected to your teacher'); dc.send(JSON.stringify(state())); };
      dc.onclose = () => setStatus('off', 'Connection lost: reload the page');
      dc.onmessage = ev => { try { onTeacher(JSON.parse(ev.data)); } catch { } };
    };
    await pc.setRemoteDescription(await unpack(msg.d));
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    await publish({ f: 's', k: 'answer', sid: SID, d: await pack({ type: pc.localDescription.type, sdp: pc.localDescription.sdp }) });
  } else if (msg.k === 'msg') { try { onTeacher(JSON.parse(msg.d)); } catch { } }
}
function connect() {
  const es = new EventSource(NTFY + EX.r + '/sse');
  es.onmessage = e => { try { const ev = JSON.parse(e.data); if (ev.event === 'message') onSignal(JSON.parse(ev.message)); } catch { } };
  es.onopen = () => publish({ f: 's', k: 'hello', sid: SID });
  setTimeout(() => { if (!dc || dc.readyState !== 'open') setStatus('', 'Connected (slow mode)'); }, 20000);
}

(async function boot() {
  drawKb();
  try { EX = await unpack(location.hash.slice(1)); if (!EX?.r || !Array.isArray(EX.q)) throw 0; }
  catch { $('#app').innerHTML = '<div class="err">This link is not valid. Ask your teacher to send it again.</div>'; return; }
  document.title = EX.t || 'Russian exercise';
  render(); connect();
})();
window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
