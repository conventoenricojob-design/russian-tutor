<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Russian exercise</title>
<style>
:root { --bg:#FAF9F5; --panel:#FFFFFF; --ink:#1F1E1D; --muted:#74716A; --line:#E7E3D9; --accent:#C96442; --soft:#F6E8E1; --ok:#3E7D55; --oksoft:#E4F0E6; --bad:#B54A3A; --badsoft:#F7E3DF; --key:#F3F1EA; --warn:#A26A12; --warnsoft:#F8EEDA;
  --ru:"Charter","Georgia","Times New Roman",serif; --serif: ui-serif,"New York",Charter,Cambria,Georgia,serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#262624; --panel:#30302E; --ink:#F0EEE6; --muted:#A6A39A; --line:#3E3D39; --accent:#D97757; --soft:#3D2C24; --ok:#7CC495; --oksoft:#22332A; --bad:#E8826E; --badsoft:#3D2A25; --key:#3A3A37; --warn:#E2B05A; --warnsoft:#3A3020; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif; padding-bottom: var(--kbh, 320px); }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right)); }
h1 { font: 500 26px/1.2 var(--serif); margin: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sub { color: var(--muted); margin: 4px 0 14px; font-size: 14px; }
.status { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--key); color: var(--muted); }
.status i { width: 9px; height: 9px; border-radius: 50%; background: #c9a227; }
.status.on i { background: var(--ok); } .status.off i { background: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; }
.instr { font-weight: 600; }
.bar2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.prog { flex: 1; min-width: 140px; font-size: 13px; color: var(--muted); }
.prog .track { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.prog .track i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; font: inherit; font-size: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { background: var(--soft); border-color: var(--accent); color: var(--accent); }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; }
.item.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.item.ok { border-color: var(--ok); } .item.bad { border-color: var(--bad); }
.q { font: 20px/1.4 var(--ru); margin-bottom: 8px; display: flex; gap: 6px; align-items: baseline; }
.q b { color: var(--muted); font: 600 14px -apple-system,"Segoe UI",sans-serif; }
.q .say { border: none; background: none; cursor: pointer; font-size: 16px; padding: 0 4px; }
.a { width: 100%; resize: vertical; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font: 22px var(--ru); color: var(--ink); outline: none; }
.a:focus { border-color: var(--accent); }
.fb { margin-top: 8px; font-size: 14px; display: none; padding: 7px 10px; border-radius: 9px; }
.fb.show { display: block; } .fb.ok { background: var(--oksoft); color: var(--ok); } .fb.bad { background: var(--badsoft); color: var(--bad); } .fb.note { background: var(--key); color: var(--ink); }
.fb .ru { font-family: var(--ru); font-size: 18px; }
.text { font: 20px/1.7 var(--ru); white-space: pre-wrap; }
.msg { background: var(--soft); border-radius: 12px; padding: 10px 14px; margin: 10px 0; display: none; }
.msg.show { display: block; }
.legend { font-size: 13px; color: var(--muted); display: none; }
.legend.show { display: block; }
.legend code { font: 13px ui-monospace, Menlo, Consolas, monospace; background: var(--key); padding: 1px 5px; border-radius: 5px; color: var(--ink); }
.err { max-width: 560px; margin: 80px auto; text-align: center; color: var(--muted); }
.name { display: flex; gap: 8px; }
.name input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; }
/* tastiera */
.kb { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-right)); box-shadow: 0 -6px 24px rgba(0,0,0,.08); z-index: 10; }
.kb.hide .rows { display: none; }
.kb .bar { display: flex; gap: 6px; justify-content: space-between; align-items: center; max-width: 980px; margin: 0 auto 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.kb .bar .tools { display: flex; gap: 5px; flex-wrap: wrap; }
.tbtn { border: 1px solid var(--line); background: var(--key); color: var(--ink); border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
.tbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.kb .rows { max-width: 980px; margin: 0 auto; touch-action: manipulation; }
.kb .r { display: flex; gap: 4px; justify-content: center; margin: 4px 0; }
.kb button.k { flex: 1 1 0; min-width: 0; max-width: 64px; height: 46px; border: 1px solid var(--line); background: var(--key); color: var(--ink); border-radius: 8px; font: 20px var(--ru); cursor: pointer; padding: 0; user-select: none; -webkit-user-select: none; }
.kb button.k:active, .kb button.k.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.kb button.w2 { flex: 1.7 1 0; max-width: 110px; font: 13px -apple-system,"Segoe UI",sans-serif; }
.kb button.sp { flex: 6 1 0; max-width: 420px; font: 13px -apple-system,"Segoe UI",sans-serif; }
@media (max-width: 640px) { .kb button.k { height: 42px; font-size: 18px; border-radius: 6px; } .kb .r { gap: 3px; } h1 { font-size: 22px; } .q { font-size: 18px; } .a { font-size: 20px; } .kb .bar .hint { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Loading…</div></div>
<div class="kb" id="kb">
  <div class="bar"><span class="hint">Tap a box, then type with these keys.</span>
    <div class="tools"><button class="tbtn" id="t-lay" onclick="toggleLayout()">Layout: ЙЦУКЕН</button><button class="tbtn" id="t-tr" onclick="toggleTranslit()" title="Type Latin letters on your computer keyboard: they become Cyrillic">Latin → Cyrillic</button>
      <button class="tbtn" id="t-phone" onclick="togglePhoneKb()">📱 Phone keyboard</button><button class="tbtn" onclick="toggleKb()">Hide</button></div></div>
  <div class="rows" id="rows"></div>
</div>
<script>
'use strict';
/* Pagina dello studente: esercizio dal link (#…), collegamento in tempo reale con l'insegnante
   (WebRTC, segnalazione via ntfy.sh), tastiera russa completa, traslitterazione, bozza salvata. */
const NTFY = 'https://ntfy.sh/';
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const b64d = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function unpack(str) {
  const bytes = b64d(str.slice(1));
  if (str[0] === 'z') return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function pack(obj) {
  const s = JSON.stringify(obj);
  if (window.CompressionStream) return 'z' + b64e(await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  return 'j' + b64e(new TextEncoder().encode(s));
}
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } } };

let EX = null, SID = Math.random().toString(36).slice(2, 12), pc = null, dc = null, cur = 0, sendT = null, slowT = null, lastSent = '';
let values = [], NAME = '', DONE = false;
const TOUCH = matchMedia('(pointer: coarse)').matches;
const PREF = store.get('rt-prefs') || {};
let layout = PREF.layout || 'std', translit = !!PREF.translit, phoneKb = !!PREF.phoneKb;
const savePrefs = () => store.set('rt-prefs', { layout, translit, phoneKb });

/* ---- tastiera a schermo */
const LAYOUTS = {
  std: ['ё1234567890-', 'йцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю.,'],
  pho: ['ё1234567890ъ', 'явертыуиопшщ', 'асдфгчйклью', 'зхцжбнмэ.,'],
};
const SOUND = { ж: 's in «pleasure»', х: 'ch in «Bach»', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'long soft sh', ы: 'dark i', ь: 'soft sign', ъ: 'hard sign', э: 'e in «met»', ю: 'yu', я: 'ya', ё: 'yo', й: 'short y' };
let shift = false;
function drawKb() {
  const k = c => `<button class="k" data-k="${c}" title="${SOUND[c] || ''}">${shift ? c.toUpperCase() : c}</button>`;
  $('#rows').innerHTML = LAYOUTS[layout].map((r, i) => `<div class="r">${i === 3 ? `<button class="k w2 ${shift ? 'on' : ''}" data-k="SHIFT">⇧</button>` : ''}${[...r].map(k).join('')}${i === 0 ? '<button class="k w2" data-k="BS">⌫</button>' : ''}${i === 3 ? '<button class="k w2" data-k="?">?</button>' : ''}</div>`).join('')
    + `<div class="r"><button class="k w2" data-k="!">!</button><button class="k w2" data-k="—">—</button><button class="k sp" data-k=" ">space</button><button class="k w2" data-k="´" title="stress mark">´</button><button class="k w2" data-k="ENTER">Next ⏎</button></div>`;
  $('#t-lay').textContent = 'Layout: ' + (layout === 'std' ? 'ЙЦУКЕН' : 'Phonetic');
  $('#t-tr').classList.toggle('on', translit); $('#t-phone').classList.toggle('on', phoneKb);
  $('#t-phone').style.display = TOUCH ? '' : 'none'; $('#t-tr').style.display = TOUCH ? 'none' : '';
  document.body.style.setProperty('--kbh', ($('#kb').offsetHeight + 16) + 'px');
}
function toggleLayout() { layout = layout === 'std' ? 'pho' : 'std'; savePrefs(); drawKb(); }
function toggleTranslit() { translit = !translit; savePrefs(); drawKb(); $('#legend')?.classList.toggle('show', translit); }
function toggleKb() { $('#kb').classList.toggle('hide'); drawKb(); }
function togglePhoneKb() { phoneKb = !phoneKb; savePrefs(); applyInputMode(); $('#kb').classList.toggle('hide', phoneKb); drawKb(); }
function applyInputMode() { document.querySelectorAll('.a').forEach(el => el.setAttribute('inputmode', TOUCH && !phoneKb ? 'none' : 'text')); }
function insertAt(inp, text, removeBefore = 0) {
  const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s, a = Math.max(0, s - removeBefore);
  inp.value = inp.value.slice(0, a) + text + inp.value.slice(e); inp.selectionStart = inp.selectionEnd = a + text.length;
  inp.dispatchEvent(new Event('input', { bubbles: true }));
}
document.addEventListener('pointerdown', e => { if (e.target.closest('#kb button.k')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest('#kb button.k'); if (!b) return;
  const k = b.dataset.k, inp = document.querySelector(`.a[data-i="${cur}"]`) || document.querySelector('.a'); if (!inp) return;
  if (k === 'SHIFT') { shift = !shift; return drawKb(); }
  if (k === 'ENTER' && inp.tagName === 'INPUT') { focusItem(Math.min(cur + 1, EX.q.length - 1)); return; }
  if (k === 'BS') { const s = inp.selectionStart, en = inp.selectionEnd; if (s === en) insertAt(inp, '', 1); else insertAt(inp, ''); }
  else { const c = k === 'ENTER' ? '\n' : k === '´' ? '́' : (shift ? k.toUpperCase() : k); insertAt(inp, c); if (shift) { shift = false; drawKb(); } }
  if (!TOUCH || phoneKb) inp.focus(); else inp.focus({ preventScroll: true });
});

/* ---- traslitterazione dalla tastiera del computer (zh → ж, sh → ш, ya → я …) */
const T1 = { a: 'а', b: 'б', v: 'в', w: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', j: 'й', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т', u: 'у', f: 'ф', x: 'х', h: 'х', c: 'ц', y: 'ы', q: 'я', "'": 'ь' };
const T2 = { 'зh': 'ж', 'сh': 'ш', 'цh': 'ч', 'кh': 'х', 'еh': 'э', 'ыa': 'я', 'ыu': 'ю', 'ыo': 'ё', 'ыe': 'е', 'йa': 'я', 'йu': 'ю', 'йo': 'ё', 'йe': 'е', 'шч': 'щ', "ь'": 'ъ' };
function translitKey(e, inp) {
  if (!translit || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  const low = e.key.toLowerCase(); if (!(low in T1)) return;
  const up = e.key !== low, s = inp.selectionStart, prev = inp.value.slice(Math.max(0, s - 1), s), pl = prev.toLowerCase();
  e.preventDefault();
  let out = T2[pl + low], rm = 1;
  if (!out && pl === 'ц' && low === 'h') out = 'ч';
  if (out && T2[inp.value.slice(Math.max(0, s - 2), s - 1).toLowerCase() + out]) { out = T2[inp.value.slice(Math.max(0, s - 2), s - 1).toLowerCase() + out]; rm = 2; }
  if (out) { const capital = prev !== pl; insertAt(inp, capital ? out.toUpperCase() : out, rm); }
  else { const c = T1[low]; insertAt(inp, up ? c.toUpperCase() : c); }
}

/* ---- voce (se il browser ha una voce russa) */
let RU = null;
const loadVoices = () => { try { RU = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)) || null; document.querySelectorAll('.say').forEach(b => b.style.display = RU ? '' : 'none'); } catch { } };
try { speechSynthesis.onvoiceschanged = loadVoices; } catch { }
function say(i) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(EX.q[i].replace(/́/g, '').replace(/_+/g, '…')); u.lang = 'ru-RU'; if (RU) u.voice = RU; u.rate = .85; speechSynthesis.speak(u); } catch { } }

/* ---- esercizio */
const draftKey = () => 'rt-draft-' + EX.r;
function render() {
  const free = EX.q.length === 1 && EX.q[0] === '✍️';
  $('#app').innerHTML = `<div class="top"><h1>${esc(EX.t)}</h1><span class="status" id="st"><i></i><span>Connecting to your teacher…</span></span></div>
    <p class="sub">${EX.n ? 'From ' + esc(EX.n) + ' · ' : ''}Your teacher sees what you type, live.</p>
    <div class="card name"><input id="nm" placeholder="Your name" value="${esc(NAME)}" autocomplete="given-name"><button class="btn" onclick="setName()">OK</button></div>
    <div class="msg" id="msg"></div>
    ${EX.i ? `<div class="card instr">${esc(EX.i)}</div>` : ''}
    ${EX.x ? `<div class="card text">${esc(EX.x)}</div>` : ''}
    <div class="legend card ${translit ? 'show' : ''}" id="legend">Latin → Cyrillic: <code>zh</code> ж · <code>ch</code> ч · <code>sh</code> ш · <code>shch</code> щ · <code>ya</code> я · <code>yu</code> ю · <code>yo</code> ё · <code>y</code> ы · <code>j</code> й · <code>kh</code>/<code>h</code> х · <code>c</code> ц · <code>eh</code> э · <code>'</code> ь · <code>''</code> ъ</div>
    ${EX.q.map((q, i) => `<div class="item" id="it${i}">${free ? '' : `<div class="q"><b>${i + 1}.</b><span>${esc(q)}</span><button class="say" title="Listen" onclick="say(${i})" style="display:none">🔊</button></div>`}
      ${free ? `<textarea class="a" data-i="${i}" rows="8" spellcheck="false" placeholder="…"></textarea>` : `<input class="a" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="…">`}
      <div class="fb" id="fb${i}"></div></div>`).join('')}
    <div class="bar2"><div class="prog"><span id="pt"></span><div class="track"><i id="pb"></i></div></div>
      <button class="btn" onclick="ask('help')">✋ I need help</button><button class="btn pri" id="donebtn" onclick="finish()">✅ I'm finished</button></div>`;
  document.querySelectorAll('.a').forEach(inp => {
    const i = +inp.dataset.i; inp.value = values[i] || '';
    inp.addEventListener('focus', () => focusItem(i, true));
    inp.addEventListener('input', () => { values[i] = inp.value; store.set(draftKey(), { values, name: NAME }); progress(); queueSend(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.tagName === 'INPUT') { e.preventDefault(); focusItem(Math.min(i + 1, EX.q.length - 1)); } else translitKey(e, inp); });
  });
  applyInputMode(); loadVoices(); progress(); focusItem(0, TOUCH);
}
function setName() { NAME = $('#nm').value.trim(); store.set(draftKey(), { values, name: NAME }); queueSend(); if (NAME) { $('#nm').blur(); flash('Hi ' + NAME + '! Your teacher can see your name.'); } }
function flash(text) { const el = $('#msg'); el.textContent = text; el.classList.add('show'); }
function progress() { const n = EX.q.filter((_, i) => (values[i] || '').trim()).length; $('#pt').textContent = `${n} of ${EX.q.length} answered`; $('#pb').style.width = (n / EX.q.length * 100) + '%'; }
function focusItem(i, noFocus) {
  cur = i; document.querySelectorAll('.item').forEach((el, j) => el.classList.toggle('cur', j === i));
  const inp = document.querySelector(`.a[data-i="${i}"]`);
  if (!noFocus) inp?.focus(); else inp?.scrollIntoView({ block: 'nearest' });
  queueSend();
}
function setStatus(kind, text) { const el = $('#st'); if (!el) return; el.className = 'status ' + kind; el.querySelector('span').textContent = text; }

/* ---- invio all'insegnante */
function state() { return { k: 'state', v: EX.q.map((_, i) => values[i] || ''), c: cur, n: NAME, done: DONE }; }
function send(obj) { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(obj)); else publish({ f: 's', k: 'msg', sid: SID, d: JSON.stringify(obj) }); }
function queueSend() {
  clearTimeout(sendT);
  sendT = setTimeout(() => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(state())); else slowSend(); }, 80);
}
function slowSend() {
  if (slowT) return;
  slowT = setTimeout(async () => { slowT = null; const s = JSON.stringify(state()); if (s !== lastSent) { lastSent = s; await publish({ f: 's', k: 'msg', sid: SID, d: s }); } }, 6000);
}
function ask(kind) { send({ k: kind, n: NAME, c: cur }); flash(kind === 'help' ? '✋ Your teacher has been told you need help.' : ''); }
function finish() { DONE = true; queueSend(); send({ k: 'done', n: NAME }); $('#donebtn').textContent = '✅ Sent!'; flash('✅ Well done! Your teacher has been told you have finished.'); }
function onTeacher(m) {
  if (m.k === 'mark') {
    const fb = $('#fb' + m.i), it = $('#it' + m.i); if (!fb) return;
    it.classList.remove('ok', 'bad'); if (m.ok === true) it.classList.add('ok'); if (m.ok === false) it.classList.add('bad');
    fb.className = 'fb show ' + (m.ok === true ? 'ok' : m.ok === false ? 'bad' : 'note');
    fb.innerHTML = (m.ok === true ? '✓ Correct' : m.ok === false ? '✗ Not quite' : '') + (m.a ? ` · answer: <span class="ru">${esc(m.a)}</span>` : '') + (m.note ? ` · ${esc(m.note)}` : '');
  } else if (m.k === 'note') flash('💬 ' + m.text);
  else if (m.k === 'focus') focusItem(m.i);
}

/* ---- collegamento */
async function publish(obj) { try { await fetch(NTFY + EX.r, { method: 'POST', body: JSON.stringify(obj) }); } catch { } }
function waitIce(p) { return new Promise(res => { if (p.iceGatheringState === 'complete') return res(); const t = setTimeout(res, 3000); p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } }); }); }
async function onSignal(msg) {
  if (msg.f !== 't' || (msg.sid && msg.sid !== SID)) return;
  if (msg.k === 'offer') {
    try { pc?.close(); } catch { }
    pc = new RTCPeerConnection({ iceServers: ICE });
    pc.ondatachannel = e => {
      dc = e.channel;
      dc.onopen = () => { setStatus('on', 'Connected to your teacher'); dc.send(JSON.stringify(state())); };
      dc.onclose = () => setStatus('off', 'Connection lost: reload the page');
      dc.onmessage = ev => { try { onTeacher(JSON.parse(ev.data)); } catch { } };
    };
    await pc.setRemoteDescription(await unpack(msg.d));
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    await publish({ f: 's', k: 'answer', sid: SID, d: await pack({ type: pc.localDescription.type, sdp: pc.localDescription.sdp }) });
  } else if (msg.k === 'msg') { try { onTeacher(JSON.parse(msg.d)); } catch { } }
}
function connect() {
  const es = new EventSource(NTFY + EX.r + '/sse');
  es.onmessage = e => { try { const ev = JSON.parse(e.data); if (ev.event === 'message') onSignal(JSON.parse(ev.message)); } catch { } };
  es.onopen = () => publish({ f: 's', k: 'hello', sid: SID });
  setTimeout(() => { if (!dc || dc.readyState !== 'open') setStatus('', 'Connected (slow mode)'); }, 20000);
}

(async function boot() {
  drawKb();
  try { EX = await unpack(location.hash.slice(1)); if (!EX?.r || !Array.isArray(EX.q)) throw 0; }
  catch { $('#app').innerHTML = '<div class="err">This link is not valid. Ask your teacher to send it again.</div>'; return; }
  document.title = EX.t || 'Russian exercise';
  const d = store.get(draftKey()); if (d) { values = d.values || []; NAME = d.name || ''; }
